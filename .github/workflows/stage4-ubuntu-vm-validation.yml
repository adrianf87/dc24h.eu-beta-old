name: Stage IV isolated Ubuntu Docker validation

on:
  push:
    branches: [test/stage4-ubuntu-vm-validation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage4-ubuntu-vm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ubuntu-operational:
    name: Stage IV Docker - ${{ matrix.os }}
    if: >-
      github.repository == 'adrianf87/dc24h.eu-high-starter' &&
      github.actor == 'adrianf87' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, server-747585786]
    container:
      image: ${{ matrix.image }}
      options: --cpuset-cpus=0-15 --memory=32g --memory-swap=32g --pids-limit=512 --security-opt=no-new-privileges --cap-drop=NET_RAW --cap-drop=SYS_ADMIN
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
        include:
          - os: ubuntu-22.04
            image: ubuntu:22.04
          - os: ubuntu-24.04
            image: ubuntu:24.04
          - os: ubuntu-26.04
            image: ubuntu:26.04
    env:
      CI: 'true'
      CXX: g++
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install isolated C++ and service-test dependencies
        run: |
          bash .github/scripts/install-ci-deps.sh \
            build-essential cmake python3 libutf8proc-dev libgcrypt20-dev \
            libssl-dev libmariadb-dev openssl ncdc mariadb-server apache2

      - name: Configure C++20 and require the integration fixtures
        run: cmake -S . -B build/Stage4VM -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DDC24H_REQUIRE_INTEGRATION_TESTS=ON

      - name: Compile server and integration tests
        run: cmake --build build/Stage4VM --parallel 4

      - name: Exercise disposable MariaDB, private HTTPS, API and ADC/ADCS
        run: |
          mkdir -p vm-evidence
          DC24H_VM_REPORT_DIR="$PWD/vm-evidence" ctest \
            --test-dir build/Stage4VM \
            --output-on-failure \
            --output-junit "$PWD/vm-evidence/ctest.xml" \
            --parallel 2 \
            -R '^(database\.(process|resilience\.process|migrations\.process)|apache2\.(https|https\.proxy|remote\.gateway)|api\.(unit|process)|adcs\.tls_security\.process|beta\.04\.stage4\.(perf\.command|recovery|release|vm\.probe)|remote\.(gateway\.config|pilot\.preflight))$'

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webadmin/package-lock.json

      - name: Install WebAdmin dependencies using the lockfile
        working-directory: webadmin
        run: npm ci

      - name: Check React/TypeScript/Vite build
        working-directory: webadmin
        run: npm run build

      - name: Install Chromium and Playwright system dependencies
        working-directory: webadmin
        run: npx playwright install --with-deps chromium

      - name: Browser end-to-end security regressions
        working-directory: webadmin
        run: npm run test:e2e -- --workers=2 --fully-parallel

      - name: Run WebAdmin unit and real C++ API integration tests
        working-directory: webadmin
        run: |
          node --import tsx --test --test-concurrency=2 tests/*.test.ts
          npm run test:integration -- ../build/Stage4VM/dc24h

      - name: Preserve isolated Docker metrics and CTest results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage4-ubuntu-vm-${{ matrix.os }}
          path: vm-evidence/
          if-no-files-found: warn
          retention-days: 7
