name: Check status

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, alpha-0.8.7, alpha-0.8.8, alpha-0.8.9, alpha-0.8.10, alpha-0.8.11, alpha-0.8.12, alpha-0.8.13, alpha-0.8.14, alpha-0.8.15, alpha-0.9.1, alpha-0.9.2, alpha-0.9.3, alpha-0.9.4, alpha-0.9.5, alpha-0.9.6, alpha-0.9.7, alpha-0.9.8, alpha-0.9.9, alpha-0.9.10, alpha-0.9.11, alpha-0.9.12, alpha-0.9.13, alpha-0.9.14, alpha-0.9.15, alpha-0.9.16, alpha-0.9.17, beta-0.1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dc24h-github-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cpp:
    name: C++ ${{ matrix.build_type }} - ${{ matrix.os }}
    if: github.repository == 'adrianf87/dc24h.eu'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
        build_type: [Debug, Release]
    env:
      CXX: g++
      CI: 'true'
      BUILD_TYPE: ${{ matrix.build_type }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Verify four logical CPUs on the GitHub-hosted runner
        run: test "$(nproc)" -eq 4

      - name: Install build and integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake python3 libutf8proc-dev libgcrypt20-dev \
            libssl-dev libmariadb-dev openssl ncdc mariadb-server apache2

      - name: Configure C++20
        run: cmake -S . -B "build/$BUILD_TYPE" -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DBUILD_TESTING=ON -DDC24H_REQUIRE_INTEGRATION_TESTS=ON

      - name: Build
        run: cmake --build "build/$BUILD_TYPE" --parallel "$(nproc)"

      - name: Test
        run: ctest --test-dir "build/$BUILD_TYPE" --parallel "$(nproc)" --output-on-failure

  webadmin:
    name: WebAdmin - ${{ matrix.os }}
    if: github.repository == 'adrianf87/dc24h.eu'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    env:
      CXX: g++
      CI: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Verify four logical CPUs on the GitHub-hosted runner
        run: test "$(nproc)" -eq 4

      - name: Install C++ API build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake python3 libutf8proc-dev libgcrypt20-dev \
            libssl-dev libmariadb-dev

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webadmin/package-lock.json

      - name: Build Release C++ API for browser integration
        run: |
          cmake -S . -B build/Release -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build/Release --target dc24h --parallel "$(nproc)"

      - name: Install frontend dependencies
        working-directory: webadmin
        run: npm ci

      - name: Typecheck and production build
        working-directory: webadmin
        run: npm run build

      - name: Frontend unit tests
        working-directory: webadmin
        run: node --import tsx --test --test-concurrency="$(nproc)" tests/*.test.ts

      - name: Install Chromium and system dependencies
        working-directory: webadmin
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        working-directory: webadmin
        run: npm run test:e2e -- --workers="$(nproc)" --fully-parallel

      - name: Real C++ API integration
        working-directory: webadmin
        run: npm run test:integration -- ../build/Release/dc24h

  required_ci:
    name: CI (C++ and WebAdmin)
    needs: [cpp, webadmin]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Ensure all C++ and WebAdmin checks passed
        env:
          CPP_RESULT: ${{ needs.cpp.result }}
          WEBADMIN_RESULT: ${{ needs.webadmin.result }}
        run: |
          test "$CPP_RESULT" = "success"
          test "$WEBADMIN_RESULT" = "success"
